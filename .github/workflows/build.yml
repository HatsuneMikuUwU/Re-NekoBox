name: Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  libcore:
    name: Native Build (${{ matrix.channel }})
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, preview]
    runs-on: ubuntu-latest
    env:
      CORE_CHANNEL: ${{ matrix.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Golang Status
        run: find buildScript/lib/core libcore/*.sh | sort | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | sort | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            libcore/libcore.aar
            libcore/libcore-sources.jar
          key: libcore-go12514-${{ matrix.channel }}-${{ hashFiles('golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          buildScript/lib/core/init.sh
          source buildScript/lib/core/get_source_env.sh
          (cd libcore && go test -v -tags "$CORE_TAGS" ./...)
          buildScript/lib/core/build.sh
      - name: Upload LibCore Artifact
        uses: actions/upload-artifact@v7
        with:
          name: core-${{ matrix.channel }}
          path: |
            libcore/libcore.aar
            libcore/libcore-sources.jar
          retention-days: 3

  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Download Stable Core
        uses: actions/download-artifact@v5
        with:
          name: core-stable
          path: core-build/stable
      - name: Download Preview Core
        uses: actions/download-artifact@v5
        with:
          name: core-preview
          path: core-build/preview
      - name: Package Dual Cores
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          python3 -m pip install --quiet cryptography || true
          KEYSTORE_ARG=""
          if [ -f "release.keystore" ]; then
            KEYSTORE_ARG="--keystore release.keystore"
          fi
          python3 .github/scripts/package_cores.py \
            --stable core-build/stable/libcore.aar \
            --preview core-build/preview/libcore.aar \
            $KEYSTORE_ARG
      - name: Upload Packaged Cores
        uses: actions/upload-artifact@v7
        with:
          name: core-dist
          path: |
            core-build/dist
            app/src/main/assets/cores
          retention-days: 7
      - name: HevTun Status
        run: |
          git submodule status hev-socks5-tunnel > hev_status
          cat buildScript/compile-hevtun.sh | sha1sum >> hev_status
      - name: HevTun Cache
        uses: actions/cache@v5
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so
            app/src/main/jniLibs/armeabi-v7a/libhev-socks5-tunnel.so
            app/src/main/jniLibs/x86/libhev-socks5-tunnel.so
            app/src/main/jniLibs/x86_64/libhev-socks5-tunnel.so
          key: hevtun-${{ hashFiles('.github/workflows/*', 'hev_status') }}
      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          [ -d "${ANDROID_HOME}/ndk/25.0.8775105" ] && echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties || true
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          KEYSTORE_PASS="${{ secrets.KEYSTORE_PASS }}" ALIAS_NAME="${{ secrets.ALIAS_NAME }}" ALIAS_PASS="${{ secrets.ALIAS_PASS }}" ./gradlew app:assembleOssRelease
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk')
          APK=$(dirname $APK)
          echo "APK=$APK" >> $GITHUB_ENV
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NekoBoxs
          path: ${{ env.APK }}
