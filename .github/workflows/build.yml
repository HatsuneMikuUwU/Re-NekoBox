name: Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  libcore:
    name: Native Build (sing-box)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Golang Status
        run: find buildScript/lib/core libcore/*.sh | sort | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | sort | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            libcore/libcore.aar
            libcore/libcore-sources.jar
          key: libcore-go12611-v115-${{ hashFiles('golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          buildScript/lib/core/init.sh
          source buildScript/lib/core/get_source_env.sh
          (cd libcore && go test -v -tags "$CORE_TAGS" ./...)
          buildScript/lib/core/build.sh
      - name: Upload LibCore Artifact
        uses: actions/upload-artifact@v7
        with:
          name: libcore
          path: |
            libcore/libcore.aar
            libcore/libcore-sources.jar
          retention-days: 3

  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Download LibCore
        uses: actions/download-artifact@v8
        with:
          name: libcore
          path: app/libs
      - name: HevTun Status
        run: |
          git submodule status hev-socks5-tunnel > hev_status
          cat buildScript/compile-hevtun.sh | sha1sum >> hev_status
      - name: HevTun Cache
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so
            app/src/main/jniLibs/armeabi-v7a/libhev-socks5-tunnel.so
            app/src/main/jniLibs/x86/libhev-socks5-tunnel.so
            app/src/main/jniLibs/x86_64/libhev-socks5-tunnel.so
          key: hevtun-${{ hashFiles('.github/workflows/*', 'hev_status') }}
      - name: Gradle cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          [ -d "${ANDROID_HOME}/ndk/25.0.8775105" ] && echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties || true
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          KEYSTORE_PASS="${{ secrets.KEYSTORE_PASS }}" ALIAS_NAME="${{ secrets.ALIAS_NAME }}" ALIAS_PASS="${{ secrets.ALIAS_PASS }}" ./gradlew app:assembleOssRelease
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk')
          APK=$(dirname $APK)
          echo "APK=$APK" >> $GITHUB_ENV
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NekoBoxs
          path: ${{ env.APK }}
